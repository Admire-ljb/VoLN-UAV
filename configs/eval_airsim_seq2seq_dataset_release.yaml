extends: airsim_active_beacon_protocol.yaml

seed: 7
paper_protocol: paper_protocol.yaml
strict_paper_protocol: true
strict_scenes: false
controller: policy
benchmark_root: data/benchmark
episodes_file: test.jsonl
semantic_bank: semantic_bank/categories.txt
adapter_ckpt: runs/adapter_voln_mllm/adapter_best.pt
planner_ckpt: runs/planner_seq2seq_vg/planner_best.pt
work_dir: runs/eval_airsim_seq2seq_vg

ip: 127.0.0.1
port: 41451
camera: 0
image_type: Scene
speed: 3.0
max_teleport_step_m: 10.0
max_teleport_vertical_step_m: 0.5
teleport_keep_initial_height: false
teleport_hover_after_setpose: true
teleport_pause_after_setpose: false
teleport_zero_velocity: true
reference_bootstrap_steps: 0
move_timeout_sec: 15.0
settle_sec: 0.05
connect_timeout_sec: 60.0
control_mode: move_to_position
budget_sec: 2.0
episode_timeout_factor: 2.0
minimum_episode_timeout_sec: 1.0
episode_path_length_factor: 2.0
minimum_episode_path_length_m: 1.0
stationary_timeout_sec: 10.0
stationary_radius_m: 0.5
max_steps: 128
success_radius: 4.0
stop_probability: null
min_steps_before_stop: 0
termination_mode: paper

env:
  auto_launch: false
  root_path: simulator_environments
  scene_mapping: configs/airsim_scene_mapping_dataset_release.json
  launch_wait_sec: 20.0
  executable_args:
    - --port
    - "{port}"

model:
  planner_variant: seq2seq
  dino_backbone: hf:facebook/dinov3-vitb16-pretrain-lvd1689m
  dino_dim: 768
  clip_image_encoder: open_clip:ViT-B-16:openai
  text_encoder: open_clip:ViT-B-16:openai
  embed_dim: 512
  adapter_hidden: 1024
  image_size: 224
  top_k_semantic: 8
  hidden_dim: 512
  num_heads: 8
  num_layers: 6
  lora_rank: 16
  horizon: 8
  memory_len: 8
  proprio_schema: body_linear_angular_relative_v1
