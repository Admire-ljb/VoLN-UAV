seed: 7
paper_protocol: paper_protocol.yaml
strict_paper_protocol: true
strict_scenes: false
controller: random
benchmark_root: data/benchmark
episodes_file: test.jsonl
semantic_bank: semantic_bank/categories.txt
adapter_ckpt: runs/adapter_voln_mllm/adapter_best.pt
planner_ckpt: runs/planner_voln_mllm/planner_best.pt
work_dir: runs/eval_airsim_voln_mllm

ip: 127.0.0.1
port: 41451
camera: 0
image_type: Scene
speed: 8.0
max_teleport_step_m: 10.0
max_teleport_vertical_step_m: 0.5
teleport_keep_initial_height: false
teleport_hover_after_setpose: true
teleport_pause_after_setpose: false
teleport_zero_velocity: true
reference_bootstrap_steps: 0
move_timeout_sec: 15.0
settle_sec: 0.05
connect_timeout_sec: 60.0
control_mode: move_to_position
budget_sec: 2.0
episode_timeout_factor: 2.0
minimum_episode_timeout_sec: 1.0
episode_path_length_factor: 2.0
minimum_episode_path_length_m: 1.0
stationary_timeout_sec: 10.0
stationary_radius_m: 0.5
max_steps: 128
success_radius: 4.0
stop_probability: null  # use Validation-Seen calibration saved in planner_best.pt
min_steps_before_stop: 0
termination_mode: paper
random_stop_probability: 0.0078125

# Leave auto_launch false if the AirSim/UE scene is already running.
# Set env.auto_launch true and point root_path/scene_mapping to your local env executables.
beacon_placement:
  enabled: true
  count: 3
  include_target: true
  allowed_tags: [left_yaw, left_turn, left90, right_yaw, right_turn, right90, up]
  straight_tag: up
  target_distance_m: 40.0
  target_lateral_m: 0.0
  target_vertical_ned_m: 0.0
  target_scale: 1.6
  ground_z_ned_by_scene:
    BrushifyUrban: -1.0
  hide_all_available: false
  start_margin_steps: 2
  end_margin_steps: 2
  lookback_steps: 2
  distance_jitter_m: 3.0
  hidden_z: -500.0
env:
  auto_launch: false
  root_path: simulator_environments
  scene_mapping: configs/airsim_scene_mapping_dataset_release.json
  launch_wait_sec: 20.0
  executable_args:
    - --port
    - "{port}"

# Optional debugging knobs:
# scene_allowlist: [BrushifyUrban]
# difficulty_allowlist: [Easy]
# episode_limit: 5

model:
  dino_backbone: hf:facebook/dinov3-vitb16-pretrain-lvd1689m
  dino_dim: 768
  clip_image_encoder: open_clip:ViT-B-16:openai
  text_encoder: open_clip:ViT-B-16:openai
  embed_dim: 512
  adapter_hidden: 1024
  image_size: 224
  top_k_semantic: 8
  planner_backbone: lmsys/vicuna-7b-v1.5
  torch_dtype: bfloat16
  gradient_checkpointing: false
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.05
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  horizon: 8
  memory_len: 8
  proprio_schema: body_linear_angular_relative_v1
