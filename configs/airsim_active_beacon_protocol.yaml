beacon_placement:
  enabled: true
  source: generated_from_route
  # direction: icon assets; text: label_* assets; random: stable per-beacon choice.
  render_mode: direction
  count: 3
  allowed_tags: [left_yaw, left_turn, left90, right_yaw, right_turn, right90, up, here]
  include_target: true
  straight_tag: here
  target_distance_m: 30.0
  target_lateral_m: 0.0
  target_vertical_ned_m: 0.0
  target_scale: 1.6
  target_people_vertical_ned_m: -100.0
  target_sign_vertical_ned_m: 10.0
  target_sign_yaw_add_deg: 90.0
  ground_z_ned_by_scene:
    BrushifyUrban: 2.0
  vertical_ned_offset_by_scene:
    BrushifyCountryRoads: 12.0
  hide_all_available: false
  start_margin_steps: 2
  end_margin_steps: 2
  lookback_steps: 2
  turn_onset_delta_deg: 0.5
  turn_merge_straight_gap_m: 6.0
  terminal_reverse_turn_window_steps: 12
  terminal_reverse_turn_max_straight_gap_m: 30.0
  turn_warning_distance_m: 30.0
  turn_forward_m: 0.0
  turn_yaw_add_deg: 90.0
  text_yaw_flip_right_turn_signs: false
  text_yaw_flip_deg: 180.0
  here_forward_m: 0.0
  distance_jitter_m: 3.0
  hidden_z: -500.0
