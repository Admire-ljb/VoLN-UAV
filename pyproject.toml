[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "voln-uav"
version = "0.1.0"
description = "Practical VoLN-UAV benchmark and training scaffold"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "torch>=2.0",
]

[project.optional-dependencies]
real = [
  "timm>=0.9.12",
  "open-clip-torch>=2.24.0",
  "transformers>=4.56.0",
  "peft>=0.17.0",
  "accelerate>=1.0.0",
  "sentencepiece>=0.2.0",
  "openai>=1.30.0",
  "airsim>=1.8.1",
]

plots = [
  "matplotlib>=3.8",
]

dev = [
  "pytest>=8.0.0",
]

[project.scripts]
voln-uav-build-benchmark = "voln_uav.cli.build_benchmark:main"
voln-uav-prepare-dataset = "voln_uav.cli.prepare_dataset_release:main"
voln-uav-train-adapter = "voln_uav.cli.train_adapter:main"
voln-uav-train-planner = "voln_uav.cli.train_planner:main"
voln-uav-eval-offline = "voln_uav.cli.eval_offline:main"
voln-uav-eval-airsim = "voln_uav.cli.eval_airsim:main"
voln-uav-validate-paper-protocol = "voln_uav.cli.validate_paper_protocol:main"
voln-uav-compile-paper-results = "voln_uav.cli.compile_paper_results:main"
voln-uav-stream-airsim = "voln_uav.cli.stream_airsim:main"
voln-uav-online-baseline = "voln_uav.cli.eval_online_baselines:main"
voln-uav-report-metrics = "voln_uav.cli.report_metrics:main"
voln-uav-review-trajectory = "voln_uav.cli.review_trajectory:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
